<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat IA</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:#212121;
    color:#fff;
    font-family:Arial,sans-serif;
    height:100vh;
    overflow:hidden;
}

.app{
    display:flex;
    height:100vh;
}

/* BARRA LATERAL */

.sidebar{
    width:260px;
    background:#171717;
    padding:12px;
    display:flex;
    flex-direction:column;
}

.new{
    padding:13px;
    border:1px solid #444;
    background:#171717;
    color:white;
    border-radius:8px;
    cursor:pointer;
    font-size:15px;
}

.new:hover{
    background:#292929;
}

.history{
    flex:1;
    overflow:auto;
    margin-top:20px;
}

.history-title{
    color:#888;
    font-size:12px;
    margin:10px;
}

.history div{
    padding:10px;
    border-radius:7px;
    cursor:pointer;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
}

.history div:hover{
    background:#292929;
}

.profile{
    border-top:1px solid #333;
    padding:15px 5px;
}

/* CHAT */

.main{
    flex:1;
    display:flex;
    flex-direction:column;
    min-width:0;
}

.top{
    height:60px;
    border-bottom:1px solid #333;
    display:flex;
    align-items:center;
    padding:0 18px;
}

.logo{
    font-weight:bold;
    font-size:18px;
}

.menu{
    display:none;
    background:none;
    border:0;
    color:white;
    font-size:25px;
    margin-right:15px;
}

/* MENSAGENS */

.messages{
    flex:1;
    overflow-y:auto;
    padding:30px 8%;
}

.welcome{
    text-align:center;
    margin-top:15vh;
}

.welcome h1{
    font-size:32px;
}

.welcome p{
    color:#999;
}

.message{
    max-width:850px;
    margin:0 auto 28px;
    display:flex;
    gap:14px;
    line-height:1.6;
}

.avatar{
    width:32px;
    height:32px;
    min-width:32px;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    font-weight:bold;
}

.ai{
    background:#10a37f;
}

.user{
    background:#555;
}

.bubble{
    flex:1;
}

.user-message{
    justify-content:flex-end;
}

.user-message .bubble{
    flex:initial;
    max-width:75%;
    background:#303030;
    padding:11px 16px;
    border-radius:18px;
}

/* IMAGEM */

.generated-image{
    max-width:100%;
    border-radius:14px;
    margin-top:10px;
    display:block;
}

.image-card{
    width:min(700px,100%);
    background:#2b2b2b;
    border:1px solid #444;
    border-radius:16px;
    padding:12px;
}

.image-title{
    color:#aaa;
    font-size:13px;
    margin-bottom:10px;
}

/* CAIXA */

.input-area{
    padding:15px 8% 25px;
}

.input-box{
    max-width:850px;
    margin:auto;
    display:flex;
    align-items:flex-end;
    background:#2f2f2f;
    border:1px solid #555;
    border-radius:18px;
    padding:8px;
}

textarea{
    flex:1;
    resize:none;
    border:0;
    outline:0;
    background:transparent;
    color:white;
    font-size:16px;
    padding:10px;
    min-height:42px;
    max-height:150px;
    font-family:Arial,sans-serif;
}

button{
    cursor:pointer;
}

.icon{
    width:40px;
    height:40px;
    border:0;
    background:transparent;
    color:#ddd;
    border-radius:50%;
    font-size:20px;
}

.icon:hover{
    background:#444;
}

.send{
    background:white;
    color:#111;
}

.send:hover{
    background:#ddd;
}

.disclaimer{
    text-align:center;
    color:#777;
    font-size:11px;
    margin-top:8px;
}

/* MOBILE */

@media(max-width:700px){

    .sidebar{
        position:absolute;
        left:-270px;
        top:0;
        bottom:0;
        z-index:20;
        transition:.25s;
    }

    .sidebar.open{
        left:0;
    }

    .menu{
        display:block;
    }

    .messages{
        padding:20px 12px;
    }

    .input-area{
        padding:10px;
    }

    .welcome h1{
        font-size:25px;
    }
}
</style>
</head>

<body>

<div class="app">

<aside class="sidebar" id="sidebar">

    <button class="new" onclick="novaConversa()">
        ＋ Nova conversa
    </button>

    <div class="history">
        <div class="history-title">Conversas</div>
        <div id="historyList"></div>
    </div>

    <div class="profile">
        👤 Meu perfil
    </div>

</aside>


<main class="main">

<header class="top">

    <button class="menu" onclick="menu()">
        ☰
    </button>

    <div class="logo">
        ✦ Chat IA
    </div>

</header>


<section class="messages" id="messages">

    <div class="welcome" id="welcome">
        <h1>Como posso ajudar?</h1>
        <p>Converse comigo ou peça para criar uma imagem. 🎨</p>
    </div>

</section>


<div class="input-area">

    <div class="input-box">

        <button
            class="icon"
            onclick="escolherImagem()"
            title="Criar imagem">
            🎨
        </button>

        <textarea
            id="input"
            placeholder="Mensagem..."
            rows="1"
            onkeydown="enter(event)"
            oninput="resize(this)">
        </textarea>

        <button
            class="icon send"
            onclick="enviar()">
            ↑
        </button>

    </div>

    <div class="disclaimer">
        A IA pode cometer erros. Confira informações importantes.
    </div>

</div>

</main>
</div>


<script>

/*
====================================================
 CONFIGURAÇÃO DA IA
====================================================

IMPORTANTE:

Não coloque sua chave secreta de API neste arquivo.

Para geração real de imagens, conecte estas funções
a um servidor/backend que faça a chamada para a API.
*/


let conversa = [];

const messages = document.getElementById("messages");
const input = document.getElementById("input");
const welcome = document.getElementById("welcome");


/* ENVIAR */

function enviar(){

    const texto = input.value.trim();

    if(!texto) return;

    welcome.style.display = "none";

    adicionarUsuario(texto);

    input.value = "";
    resize(input);

    conversa.push(texto);

    /*
    Detecta pedidos de imagem automaticamente.
    */

    if(ehPedidoDeImagem(texto)){

        mostrarCriacaoImagem(texto);

    }else{

        responderTexto(texto);

    }
}


/* DETECTAR IMAGEM */

function ehPedidoDeImagem(texto){

    const palavras = [
        "crie uma imagem",
        "criar uma imagem",
        "gere uma imagem",
        "gerar uma imagem",
        "faça uma imagem",
        "fazer uma imagem",
        "desenhe",
        "desenhar",
        "gere uma foto",
        "crie uma foto",
        "imagem de"
    ];

    const t = texto.toLowerCase();

    return palavras.some(p => t.includes(p));
}


/* MENSAGEM DO USUÁRIO */

function adicionarUsuario(texto){

    const div = document.createElement("div");

    div.className = "message user-message";

    div.innerHTML = `
        <div class="bubble">
            ${esc(texto)}
        </div>

        <div class="avatar user">
            B
        </div>
    `;

    messages.appendChild(div);

    scroll();
}


/* RESPOSTA NORMAL */

function responderTexto(texto){

    const div = document.createElement("div");

    div.className = "message";

    div.innerHTML = `
        <div class="avatar ai">
            ✦
        </div>

        <div class="bubble">
            ${resposta(texto)}
        </div>
    `;

    messages.appendChild(div);

    scroll();
}


/* RESPOSTAS DEMONSTRATIVAS */

function resposta(texto){

    const t = texto.toLowerCase();

    if(t.includes("oi") || t.includes("olá")){
        return "Olá! 😊 Como posso ajudar você?";
    }

    if(t.includes("quem é você")){
        return "Eu sou o seu assistente virtual. ✦";
    }

    if(t.includes("html")){
        return "Posso ajudar você a criar sites completos com HTML, CSS e JavaScript. 💻";
    }

    if(t.includes("copa")){
        return "⚽ Copa do Mundo! Posso conversar sobre seleções, jogadores e muito mais.";
    }

    return "Entendi! 😊<br><br>" +
           "Você disse: <b>" +
           esc(texto) +
           "</b><br><br>" +
           "Para eu responder com uma IA de verdade, conecte este chat a um modelo de linguagem através de um backend.";
}


/* CRIAÇÃO DA IMAGEM */

function mostrarCriacaoImagem(prompt){

    const div = document.createElement("div");

    div.className = "message";

    div.innerHTML = `
        <div class="avatar ai">
            ✦
        </div>

        <div class="bubble">

            <div class="image-card">

                <div class="image-title">
                    🎨 Criando imagem...
                </div>

                <div id="imageArea">
                    <div style="
                        padding:40px;
                        text-align:center;
                        color:#999;
                    ">
                        ✨ Preparando sua imagem...
                    </div>
                </div>

            </div>

        </div>
    `;

    messages.appendChild(div);

    scroll();

    /*
    Aqui entraria a chamada real para o serviço
    de geração de imagens.

    Exemplo conceitual:

        gerarImagem(prompt)

    */

    setTimeout(() => {

        const area = document.getElementById("imageArea");

        if(!area) return;

        area.innerHTML = `
            <div style="
                padding:25px;
                color:#aaa;
                text-align:center;
            ">
                🖼️ O pedido foi identificado como criação
                de imagem.<br><br>

                Para gerar a imagem de verdade,
                conecte esta função a uma API de
                geração de imagens.
            </div>
        `;

    },1000);
}


/*
====================================================
 FUNÇÃO PARA API DE IMAGEM
====================================================

O frontend deve enviar o prompt para seu backend.

Exemplo:

async function gerarImagem(prompt){

    const resposta = await fetch("/api/imagem", {
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({
            prompt:prompt
        })
    });

    const dados = await resposta.json();

    return dados.url;
}

Seu backend então conversa com o serviço
de geração de imagens.
*/


/* BOTÃO 🎨 */

function escolherImagem(){

    input.value = "Crie uma imagem de ";

    input.focus();

}


/* NOVA CONVERSA */

function novaConversa(){

    conversa = [];

    messages.innerHTML = `
        <div class="welcome" id="welcome">
            <h1>Como posso ajudar?</h1>
            <p>Converse comigo ou peça para criar uma imagem. 🎨</p>
        </div>
    `;

    input.value = "";

}


/* HISTÓRICO */

function salvarHistorico(texto){

    const item = document.createElement("div");

    item.textContent = texto;

    document.getElementById("historyList")
        .prepend(item);

}


/* MENU MOBILE */

function menu(){

    document
        .getElementById("sidebar")
        .classList.toggle("open");

}


/* ENTER */

function enter(event){

    if(event.key === "Enter" && !event.shiftKey){

        event.preventDefault();

        enviar();

    }

}


/* TAMANHO DO TEXTO */

function resize(el){

    el.style.height = "auto";

    el.style.height =
        Math.min(el.scrollHeight,150) + "px";

}


/* ESCAPAR HTML */

function esc(texto){

    return texto
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* SCROLL */

function scroll(){

    messages.scrollTop =
        messages.scrollHeight;

}

</script>

</body>
</html>
